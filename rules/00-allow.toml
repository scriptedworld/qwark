# qwark, the structural phase: permission, and no requirement to be described.
#
# ############################################################################
# The structural phase is this file and `01-structure.toml`, and nothing else.
#
# `05-declarations.toml`, `10-commands.toml`, `20-paths.toml`, `30-options.toml`
# and `40-state.toml` exist in the source tree and are deliberately NOT loaded.
# They deny by command class, by path and by option, and those are later phases.
# ############################################################################
#
# ----------------------------------------------------------------------------
# Turning off the requirement to declare, and what it costs
# ----------------------------------------------------------------------------
#
# FR-4.16 refuses a command qwark holds no declaration for, and it arrives
# BEFORE shape decides anything. So a rule set of structural rules alone refuses
# every command rather than judging the ones it understands. Measured
# 2026-08-28: `01-structure.toml` plus a permissive allow rule answered
# "(engine) declared commands only" to `ls`, `rm -rf` and `git add -N` alike.
#
# Declaring commands instead was tried and abandoned for a stated reason: it
# refused roughly two thirds of what sessions actually run, before any
# replacement for those commands existed, which stops the work rather than
# shaping it.
#
# ############################################################################
# What this gives up. Read it before assuming the gate is stronger than it is.
#
# Any command word runs, if its shape is clean. That includes interpreters:
#
#     python3 -c '<any program>'
#
# is a single command with no redirection, substitution, pipe or glob, so
# nothing here objects to it, and what it executes is invisible to every rule.
# `sudo`, `curl`, `chmod`, `just`, `make` and every task runner are permitted on
# the same terms.
#
# **This phase is observation, not containment.** The corpus figures describing
# what qwark would refuse were measured against a rule set that refused
# undeclared words, and they do not describe this one.
#
# The way back is to declare commands and then delete the `[declarations]` table
# below. It is a single boolean with no middle ground on purpose: a partial
# version, where some commands need declaring and others do not, is a list of
# exceptions nobody can read as a policy.
# ############################################################################

# Both are said, and both are needed, because the two refusals sit at different
# levels. `required` covers the command word. `accounted` covers the options a
# DECLARED command carries (FR-6.7). An undeclared command's options are never
# decomposed, so while nothing is declared, `accounted` looks unnecessary and is
# not: declare one command for any reason, including wanting to write a rule
# about it later, and every option it carries starts being refused again.
#
# Saying both means this phase behaves the same whether or not a declaration
# file happens to be loaded, rather than depending on an absence somebody
# changes months from now for an unrelated reason.
#
# Both are for now. The way back is to declare commands with their option sets,
# then delete this table. Deleting it restores FR-4.16 and FR-6.7 as written,
# because absent means required.

# `default = "allow"` is the permission. Deny is the engine's default when this
# is absent (FR-4.35), and `01-structure.toml` carries only refusals, so the
# structural rules alone would permit nothing, which is indistinguishable from a
# broken gate.
#
# It decides only where no rule did. It is a setting and not an allow rule
# because an allow outranks every ask and deny it matches, and a rule matching
# every command would lift them all. A block is never lifted, so anything that
# redirects, substitutes, pipes, globs, backgrounds, or carries more than one
# statement is refused as before.
#
# It does not survive the phase. Permitting what no rule decided is right while
# the gate is observing what real use looks like, and wrong afterwards. Delete
# the line rather than narrowing it.
#
# An `allow` verdict replaces the normal permission flow rather than passing to
# it, so the prompt Claude Code would otherwise raise does not appear. A
# structurally clean command runs unprompted, `rm -rf <path>` among them,
# because no option rule is loaded. The ruling on `rm -f`, `-r` and `-rf` lives
# in `30-options.toml` and returns with that file.

[declarations]
required  = false
accounted = false
default   = "allow"
