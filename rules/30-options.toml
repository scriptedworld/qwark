# qwark, denials by option.
#
# These rules depend on the declaration table, which is what says that `-f`
# means force to `rm` and file to `tar`. Without a declaration for a command,
# no clause here can fire, and that is not a gap, because an undeclared command
# is denied outright.
#
#   option = "force"   an option whose declared meaning is force was given,
#                      however it was spelled
#
# Why this matches meaning rather than text: `rm -f`, `rm -rf`,
# `rm -fr`, `rm -r -f`, `rm --force`, `rm --forc`, `rm --fo` and `rm --f` all
# force. GNU accepts any unambiguous abbreviation, and short options bundle, so
# a clause comparing an argument against `-f` or `--force` sees it in two of
# those eight. It also correctly does not fire on `rm -- -f`, where the `-f` is
# a filename.

# ============================================================================
# The worked example
# ============================================================================
#
# The ruling: bare `rm` is fine, recursion is a person's call, and force is
# never allowed.
#
#     rm x       permitted, by allow-removing-a-named-file in 10-commands.toml
#     rm -r x    asked: a recursive removal, confirmed by a person
#     rm -f x    blocked
#     rm -rf x   blocked, because it contains -f
#
# Two rules rather than three, because `rm -rf` matches both and precedence
# decides: the block outranks the ask, so neither rule has to know the other
# exists.
#
# The allow for `rm` excludes recursion. Allow outranks ask, so an allow that
# matched `rm -r` would lift the ask and nobody would be asked.

[[rule]]
id     = "rm-force"
action = "block"
reason = """
`rm` with force suppresses every check it has: it does not ask, and it does not
report what was missing. If the file should go, name it and let rm say whether
it was there."""

  [[rule.clause]]
  index = "0"
  value = "rm"

  [[rule.clause]]
  option = "force"

[[rule]]
id     = "rm-recursive"
action = "ask"
reason = """
A recursive removal. What it deletes is decided by what the tree holds when it
runs, not by anything this command names. Check the path before confirming."""

  [[rule.clause]]
  index = "0"
  value = "rm"

  [[rule.clause]]
  option = "recursive"

# ============================================================================
# Forbidden unless
# ============================================================================
#
# A conditional refusal, written as one rule with an inverted clause rather
# than as two rules where one outranks the other.
#
#   absent = true    the clause holds when what it names is not there
#
# This is how an exception to a block is written: inside the rule it modifies,
# since nothing outranks a block. An exception to a deny can instead be an
# allow of its own.
#
# The live example is now `no-git-staging` in 10-commands.toml, which refuses
# `git add` unless `-N` is present.
#
# ############################################################################
# There is no `commit-must-be-signed`.
#
# Such a rule would refuse `git commit` unless `--gpg-sign` was given, and it
# would be wrong in two separate ways at once.
#
# It asserts a property nobody asked for. Nothing on this machine signs:
# `commit.gpgsign`, `user.signingkey` and `gpg.format` are unset, and
# `git log --format=%G?` answers `N` on every commit. So the rule would forbid
# the only kind of commit that can be made here: 905 commits in the corpus,
# all of them refused. Signing is not a requirement.
#
# And it is the worked example of the dishonest form of this shape.
# `--gpg-sign` is not declared, so the inverted clause is satisfied by the
# absence of a declaration and not by the absence of the option, and the rule
# tells somebody who has signed that they must sign. The refusal is safe and
# its message is false.
#
# The lesson: a "refused unless" rule is only honest when the
# option it excepts is declared. Written up as shape 3 in
# docs/PATTERNS/the-mechanicals-the-shapes-a-rule-can-be-written-in.md. Dropping
# the rule rather than making it conditional on the repository's git config was
# deliberate: that would leave a verdict depending on a setting the agent being
# judged can change.
# ############################################################################

# ============================================================================
# Force, generally
# ============================================================================
#
# Not a group of commands but a single clause with no command named at all:
# any declared command given an option meaning force. A rule that named the
# commands would need editing every time a declaration is added, and would be
# wrong in the interval.

[[rule]]
id     = "no-forcing-anything"
action = "block"
reason = """
Forcing is not permitted. A force option exists to suppress the check that
would otherwise have stopped the command, which makes it the one option a gate
cannot let past."""

  [[rule.clause]]
  option = "force"

[[rule]]
id     = "no-preserve-root"
action = "block"
reason = "`--no-preserve-root` exists only to permit destroying the root filesystem."

  [[rule.clause]]
  option = "no-preserve-root"

# ============================================================================
# Skipping a hook
# ============================================================================
#
# The same shape as force, and for the same reason: an option whose entire
# purpose is to suppress the check that would otherwise have stopped the
# command. `--force` says do it anyway; `--no-verify` says do not look.
#
# It is not command-scoped, because `commit` and `push` both take it and a rule
# naming them would be wrong the moment a third one does.

[[rule]]
id     = "no-skipping-hooks"
action = "block"
reason = """
`--no-verify` skips the hooks, which are the checks that run without being
asked for and are therefore the ones a mistake cannot route around. The
attribution gate is the case that matters here: it fires on false positives by
design, because a miss costs more than the friction, and the answer to a false
positive is to rephrase the line rather than to turn the gate off.

If a hook is wrong often enough to be worth skipping, fix the hook."""

  [[rule.clause]]
  option = "no-verify"

# ============================================================================
# Options that name a program to run
# ============================================================================
#
# These belong with the interpreters in 10-commands.toml by reason, and here by
# shape: the command is ordinary and one option turns it into an interpreter.

[[rule]]
id     = "no-option-supplied-program"
action = "block"
reason = """
This option supplies a program for the command to run. The program is not
visible to any rule here, so permitting the option is permitting whatever it
names."""

  [[rule.clause]]
  option = "execute"

# ============================================================================
# Destructive by meaning
# ============================================================================

[[rule]]
id     = "ask-before-hard-reset"
action = "ask"
reason = """
A hard reset discards uncommitted work with no copy kept. Confirm the tree
holds nothing you want."""

  [[rule.clause]]
  option = "hard"

[[rule]]
id     = "ask-before-pruning"
action = "ask"
reason = "Pruning deletes whatever the command considers unreachable."

  [[rule.clause]]
  option = "prune"
