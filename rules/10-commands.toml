# qwark, denials by command name.
#
# Groups exist so that a class of commands sharing one reason is written as a
# list rather than as twenty near-identical rules or as one regex alternation.
# A list is greppable, diffable, and adding a command to a class is a one-line
# edit that does not touch the rule.
#
# A group is a set-membership test in one clause, so it does not reintroduce
# the `or` that rules deliberately lack: the clause still either matches or
# does not, and the rule still needs all its clauses.
#
# **A group declares how its members are compared.** `match` defaults to
# "value", the whole word exactly. A group of paths must say `match = "partial"`
# (see 20-paths.toml) because paths are prefixes and an exact comparison would
# never match.
#
# An empty group should be a configuration error, for the same reason an empty
# `partial` is: a deny rule whose group someone emptied stops firing while
# still reading as an active rule.

# ============================================================================
# Groups
# ============================================================================

# Wrappers, the commands that run other commands, are in 03-wrappers.toml so
# that the live set carries them too.

# The program is an argument rather than a file, so what runs is never visible
# to a gate that reads command lines.
#
# `sed` and `awk` are here because both execute, through GNU sed's `e` command
# and awk's `system()`. Allowing them safely would mean parsing their programs,
# which is a second language. They stay denied: file manipulation the file
# tools cannot do belongs in a full programming language, not in sed or awk.
#
# The languages in script-language below are not here. A script file in one of
# them runs; a program written into the command line is still refused, by
# 02-inline-code.toml (FR-4.36) and by their declarations naming no options.
[group.interpreter]
members = [
  "sh", "bash", "zsh", "dash", "ksh", "fish", "csh", "tcsh",
  "python2", "deno", "bun",
  "php", "lua", "tclsh", "Rscript",
  "awk", "gawk", "mawk", "nawk", "sed",
  "ed", "vi", "vim", "nvim", "emacs", "gdb", "lldb",
]

# Full programming languages whose script files may run. The file is written
# with the file tools first, so what runs is a diff somebody can read.
# `allow-running-a-script` names them, and each is declared in
# 05-declarations.toml with no options, so `-c`, `-e` and `-m` stay refused.
[group.script-language]
members = ["python", "python3", "perl", "ruby", "node"]

# These change what a later command resolves to or does. Their damage is not in
# the call that runs them.
#
# `export`, `declare`, `readonly`, `local` and `typeset` are not here: they
# parse as declaration keywords rather than command words, and are denied by
# the `declaration` fact in 01-structure.toml.
[group.resolution]
members = [
  "eval", "source", ".", "alias", "unalias",
  "set", "shopt", "setopt", "unsetopt", "hash", "trap", "unset",
  "ulimit", "umask", "enable", "disable",
  # `direnv allow` blesses a .envrc, which then runs on every later shell entry
  # in that directory: an executor and a resolution change at once, and the
  # damage is in neither the blessing call nor any command that follows it.
  "direnv",
]

# These execute content from the working tree: recipes, test files, hooks, all
# of which the agent can write with no shell involved.
#
# This is the group to decide deliberately. Allowing any of them is allowing
# arbitrary execution. `go test` running this project's own suite is the obvious
# case, and if it is permitted it should be an explicit, reasoned exception with
# that written beside it, never a quiet allow.
# ############################################################################
# Read this before adding a name. **The list is not what makes this safe.**
#
# Deny-by-default is. A command absent from every group is refused anyway
# (FR-4.16, FR-4.35), so adding a name here buys a reason, not a refusal: it
# turns "nothing permitted this" into a message that says what the class is and
# why nobody gets it (FR-4.21).
#
# A runner in this group is refused by `no-executors`, naming the threat. One
# missing from it is refused by "(engine) deny by default", naming nothing.
#
# **Completing this list is not achievable and is not the goal.** A task runner
# nobody here has heard of is still denied. Write the name down when you meet
# it, so the next refusal explains itself.
# ############################################################################
[group.executor]
members = [
  # Task runners: the recipe is a file in the tree.
  "make", "gmake", "just", "task", "go-task", "poe", "poethepoet",
  "bolt", "rake", "invoke", "mage", "dagger",
  # Package-manager scripts, which are recipes under another name.
  "npm", "yarn", "pnpm", "npx", "bunx", "deno",
  # Build systems and monorepo drivers.
  "cargo", "gradle", "mvn", "ant", "sbt", "lein", "stack", "cabal",
  "bazel", "buck", "buck2", "earthly", "please", "pants",
  "nx", "turbo", "lerna", "scons", "meson", "ninja", "cmake", "waf",
  "dotnet", "msbuild", "mix", "rebar3", "composer",
  # Test runners: the test file is content the agent can write.
  "pytest", "tox", "nox", "jest", "vitest", "mocha", "rspec", "phpunit",
  # Hook managers: they exist to run files from the tree on an event.
  "pre-commit", "lefthook", "husky", "overcommit",
  # File-watchers, which run a command every time the tree changes, so the
  # command they run need not be typed at all.
  "watchexec", "entr", "nodemon", "reflex", "air", "tilt", "skaffold",
  # Orchestrators that take a definition file and act on it.
  "docker", "docker-compose", "podman", "ansible", "ansible-playbook",
  "terraform", "tofu", "pulumi", "vagrant", "helm", "kustomize",
  "act", "circleci", "drone", "woodpecker",
  # Schedulers, which run a command later and out of sight.
  "systemctl", "cron", "crontab", "at", "batch", "systemd-run",
]

# Subcommands of `go` that compile and run code, as opposed to inspecting it.
[group.go-executes]
members = ["test", "run", "generate", "tool"]

# ----------------------------------------------------------------------------
# git, classified
# ----------------------------------------------------------------------------
#
# **Most git commands are not okay for the agent to execute.** Read-only is
# allowed, the rest denied by class, each class carrying its own reason. All 64
# porcelain commands are classified, checked against `git --list-cmds`.
#
# The classes overlap, and that is the point. `rebase` runs hooks and rewrites
# history; `push` runs hooks and reaches the network. Under FR-4.34 every
# refusing reason is collected, so a command in three classes is refused with
# all three stated. A command belongs in a class when the class's reason is true of it,
# not when no other class claimed it first.
#
# ############################################################################
# No git subcommand is unconditionally safe. Read this before editing the
# read-only list below. All four measured against git 2.47.3:
#
#     git diff --output=<file>    writes a file
#     git log --ext-diff          runs the program named by diff.external
#     git grep -O <prog>          launches that program
#     git help -w <topic>         opens a browser
#
# The allow list is safe because **git's declaration does not name those
# options, and an option the declaration does not name is refused** (FR-6.7),
# not because those subcommands read.
#
# So adding an option to the declaration is what makes it reachable.
# `--ext-diff` and `-O` must either stay undeclared or be declared with
# `means = "execute"`, which `no-option-supplied-program` in 30-options.toml
# already denies.
# ############################################################################

# Runs a hook, a filter, or a merge driver out of the repository, all of them
# files that can be written with no shell involved.
#
# `checkout`, `switch` and `restore` are here for the smudge filter and the
# post-checkout hook; `archive` for export-subst; `stash` because applying one
# runs the same filters a checkout does.
#
# ############################################################################
# `commit` is not a member.
#
# `git commit` runs the `commit-msg` hook, and on this machine that hook is the
# attribution guarantee: `~/.git-hooks/no-ai-attribution` is the thing hard
# rule 1 depends on. Listing `commit` here would refuse `git commit` precisely
# because it runs the check that has to run.
#
# With `commit` listed, `git commit <path> -F <msg>`, the command hard rule 3
# mandates for every commit, would be refused. The corpus holds 1,124
# `git commit` invocations.
#
# The general reason still stands for the other sixteen members: a hook is a
# file the agent can write, and running one is running that file. `commit` is
# the case where the hook running is the point.
# ############################################################################
[group.git-runs-hooks]
members = [
  "merge", "rebase", "am", "apply", "cherry-pick", "revert",
  "push", "pull", "clone", "fetch", "checkout", "switch", "restore",
  "stash", "archive", "filter-branch",
]

# Exists to launch another program. The program is chosen by configuration or
# by the environment, so it is never visible in the command line being judged.
[group.git-runs-a-program]
members = [
  "difftool", "mergetool", "citool", "gui", "gitk", "instaweb", "scalar",
  "send-email", "request-pull", "imap-send",
  "svn", "p4", "cvsimport", "cvsexportcommit", "cvsserver", "archimport",
  "quiltimport", "web--browse",
]

# Rewrites or discards what is recorded, so the copy that would show what was
# lost is the thing being changed.
#
# `reflog` is not here. The subcommand is what writes, not the word: `git
# reflog` reads, and only `expire`, `delete` and `drop` destroy. It sits in
# git-reads, with those three refused by `no-git-destroying-the-reflog` below.
# Denying the whole word would make `no-deleting-after-a-rebase`'s own
# instruction impossible to follow and its tag impossible to clear, since **a
# denied command has no effect of any kind (FR-4.24)**.
[group.git-rewrites-history]
members = [
  "rebase", "filter-branch", "reset", "gc", "prune", "repack", "replace",
  "maintenance", "bundle",
]

# The three `git reflog` subcommands that write. They are named at ordinal 2,
# which is the mechanism that lets a command be allowed as a word and refused
# in a shape: the first entry in the mechanicals set.
[group.git-reflog-writes]
members = ["expire", "delete", "drop"]

# Discards work in the working tree that was never committed, so there is no
# copy anywhere.
[group.git-destroys-work]
members = [
  "clean", "checkout", "restore", "reset", "stash", "rm", "mv",
  "sparse-checkout",
]

# Changes what a later git command does. The damage is never in the call that
# runs it, which is the same reason `eval` and `export` are denied.
#
# `init` is here because it reinitialises an existing repository; `bisect`
# because it writes BISECT_* state and checks out a commit to do it.
[group.git-changes-config]
members = [
  "config", "remote", "submodule", "sparse-checkout", "replace", "notes",
  "worktree", "maintenance", "init", "bisect", "refs",
]

# Reaches a machine that is not this one, sending what is here or fetching what
# will be trusted here.
[group.git-network]
members = [
  "fetch", "pull", "push", "clone", "submodule", "send-email", "request-pull",
  "bundle", "archive",
]

# Reads when bare and writes when given an option, so the word alone does not
# say what the command does. `git branch` lists branches and `git branch -D
# main` deletes one; `git tag` lists tags and `git tag -d` removes one;
# `git format-patch` writes .patch files into the working directory unless it
# is given --stdout.
#
# These are refused as whole words rather than left to deny-by-default, because
# the way to have them is a rule naming the shape, which is what the mechanicals
# list is for. `stash`, `remote`, `worktree`, `notes`, `submodule`, `reflog`,
# `bisect` and `refs` are the same case and are already denied above for a
# second reason.
[group.git-shape-dependent]
members = ["branch", "tag", "format-patch"]

# Writes .git/index. Staging preserves what it stages, so it is not destructive,
# but the index is precisely what a later commit records, making this the first
# half of an operation whose second half is denied.
[group.git-writes-the-index]
members = ["add", "stage"]

# Reads and writes nothing. **These are the only git subcommands eligible to be
# allowed**, and eligibility is not permission: an allow rule still has to name
# them, and every deny above still outranks it.
#
# git-shape-dependent above is not here. Those are the "allowed only in a
# particular shape" commands and belong in the mechanicals list, not in a group
# that allows the bare word.
#
# `fsck` is here on the same undeclared-option property as the rest: bare, it
# only verifies. `git fsck --lost-found` writes into .git/lost-found, and stays
# refused for as long as nobody declares that option.
[group.git-reads]
members = [
  "log", "show", "diff", "status", "blame", "grep", "shortlog", "describe",
  "show-branch", "whatchanged", "range-diff", "cherry", "fsck", "help",
  "reflog",
]

# ============================================================================
# Rules
# ============================================================================

[[rule]]
id     = "no-interpreters"
action = "block"
reason = """
This runs code supplied as an argument, which no rule here can read. Put the
code in a file with the file tools if it needs to exist."""

  [[rule.clause]]
  index = "0"
  group = "interpreter"

[[rule]]
id     = "no-resolution-changes"
action = "block"
reason = """
This changes what later commands resolve to or how they behave. Its effect is
not in this call, which is exactly why it cannot be judged by looking at this
call."""

  [[rule.clause]]
  index = "0"
  group = "resolution"

[[rule]]
id     = "no-executors"
action = "block"
reason = """
This executes content from the working tree (a recipe, a test file, a hook),
which is content that can be written without a shell. Permitting it is
permitting arbitrary execution, so it is permitted only by name, per command,
with a reason recorded."""

  [[rule.clause]]
  index = "0"
  group = "executor"

# Two commands that are mostly fine and have a few subcommands that are not.
# The clauses compose: ordinal 0 names the command, ordinal 1 the subcommand,
# and both must match for the rule to apply, so `go build` is untouched by this
# rule and settled elsewhere.

[[rule]]
id     = "no-go-execution"
action = "block"
reason = """
`go test`, `go run`, `go generate` and `go tool` compile and execute code from
this tree, including code written moments ago. `go build` and `go vet` do not."""

  [[rule.clause]]
  index = "0"
  value = "go"

  [[rule.clause]]
  index = "1"
  group = "go-executes"

# The six git denials by class. Each names one class and states that class's
# reason, so a command in more than one is refused with each reason given, which
# tells its author that no other spelling would help.

# The three classes that follow are denies and not blocks, so that an ask can
# hand one narrow case of them to a person: a hard reset, a pruning gc, a
# rebase. Nothing allows any of their members, so without an ask they refuse
# exactly as a block would. Reaching the network stays a block.
[[rule]]
id     = "no-git-hook-running"
action = "deny"
reason = """
This git subcommand runs hooks from .git/hooks, or a filter or merge driver
named in .git/config, all of them files that can be written with no shell
involved. Reading the repository does not."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-runs-hooks"

[[rule]]
id     = "no-git-launching-a-program"
action = "block"
reason = """
This git subcommand exists to launch another program, chosen by configuration
or by the environment rather than by this command line. What runs is therefore
never visible to a gate reading the command."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-runs-a-program"

[[rule]]
id     = "no-git-rewriting-history"
action = "deny"
reason = """
This git subcommand rewrites or discards what the repository has recorded. The
copy that would show what was there before is the thing being changed, so the
mistake and the evidence of it go together."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-rewrites-history"

[[rule]]
id     = "no-git-destroying-work"
action = "deny"
reason = """
This git subcommand discards work in the working tree that was never committed.
Uncommitted work exists in one place, and this is the command that empties it."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-destroys-work"

[[rule]]
id     = "ask-before-rebasing"
action = "ask"
reason = """
A rebase rewrites the commits on this branch and runs hooks while it does.
Confirm the branch and the base before it runs."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  value = "rebase"

[[rule]]
id     = "no-git-changing-configuration"
action = "block"
reason = """
This git subcommand changes what a LATER git command will do. Its effect is not
in this call, which is exactly why looking at this call cannot judge it: the
same reason `eval` and `export` are refused."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-changes-config"

[[rule]]
id     = "no-git-reaching-the-network"
action = "block"
reason = """
This git subcommand reaches a machine that is not this one, publishing what is
here, or fetching what will then be trusted here. Neither is a thing to do
without somebody having decided to."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-network"

[[rule]]
id     = "no-git-by-the-bare-word"
action = "block"
reason = """
This git subcommand reads when bare and writes when given an option, so the
word alone does not say what it does: `git branch` lists and `git branch -D`
deletes. Having it means a rule that names the shape it is allowed in, not a
rule that names the word."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-shape-dependent"

# The first mechanical: allowed as a word, refused in a shape.
#
# `git reflog` is in git-reads and reading it is the documented way out of the
# post-rebase tag in 40-state.toml. The three subcommands that destroy the
# reflog are refused here by naming ordinal 2, so the word stays available and
# the destructive form does not.
#
# This is the shape every other shape-dependent git command will want, with the
# subcommand at an ordinal other than 1.

[[rule]]
id     = "no-git-destroying-the-reflog"
action = "block"
reason = """
The reflog is the record every recovery from a rewritten history depends on,
and these are the three subcommands that discard it. Reading the reflog is
permitted precisely so that it is there to read."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  value = "reflog"

  [[rule.clause]]
  index = "2"
  group = "git-reflog-writes"

# Narrowed instead of given an exception, because the guarantee it protects is
# about content and `git add -N` carries none.
#
# The index is shared between concurrent sessions in one worktree, so one
# session staging content and another committing puts the first one's work into
# the second one's commit, invisibly.
# docs/LESSONS/concurrent-sessions-share-one-index/.
#
# `git add -N` records that a path exists and stages no content, which is why
# hard rule 2 requires it for every new file: `git commit <path>` fails with
# `pathspec did not match` without it. Nothing another session could commit is
# added by it.
#
# Written as an inverted clause rather than as a second allow rule so the way
# out sits inside the denial that a refused agent reads. That shape is only
# honest when the option it excepts is declared, which `-N` is. 30-options.toml
# says why the same shape fails on signing.

[[rule]]
id     = "no-git-staging"
action = "block"
reason = """
Staging content writes .git/index, which is what a later commit records, and
the index is shared with every other session in this worktree: staging here
puts your work into whatever they commit next. `git add -N <path>` is
permitted, because it records that a path exists and stages no content, which
is the form a new file needs before `git commit <path>` can name it."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-writes-the-index"

  [[rule.clause]]
  option = "intent-to-add"
  absent = true

# The allowed half: read-only allowed, the rest denied by class. This is the
# only allow rule in the shipped set, and deliberately the narrowest thing that
# could be written.
#
# It permits nothing on its own. `git` has to be declared for it to fire at all
# (05-declarations.toml), the subcommand has to be in git-reads, and every deny
# above outranks it, so a subcommand appearing in both lists is refused, and
# adding a member to git-reads cannot quietly beat a denial.
#
# What actually keeps this narrow is the option table rather than this rule:
# `git log --ext-diff` and `git help -w` are refused because 05 does not name
# those options, not because anything here mentions them.

[[rule]]
id     = "allow-reading-the-repository"
action = "allow"
reason = """
Reading the repository changes nothing in it."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-reads"

[[rule]]
id     = "no-git-config-override"
action = "block"
reason = """
`git -c` sets configuration for one invocation, including values such as
core.pager and core.hooksPath that name a program to run."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  value = "-c"

# The same thing as the rule above, in the spelling that persists. Without this
# rule `git config` is refused only by deny-by-default, whose message says
# nothing about why:
#
#     git config core.hooksPath /tmp/x   -> deny, "(engine) deny by default"
#     git config alias.st "!sh -c rm"    -> deny, "(engine) deny by default"
#
# The path rules in 20-paths.toml cannot reach this. `.git/config` is in the
# repository-hooks group, but `git config` never names that file: the target is
# a configuration key, so there is no path word for a path rule to read.
#
# An alias is the sharpest case: one defined in a repository's own `.git/config`
# executes on a plain `git` invocation, which is why internal/repo reads
# .git/HEAD rather than running git at all.
#
# Reading configuration (`git config --get`, `--list`) changes nothing and is a
# reasonable later exception. It would be written as an inverted clause inside
# this rule, where a reader of the denial sees it, and it needs git's options
# declared before it can be stated at all.

[[rule]]
id     = "no-git-config-writing"
action = "block"
reason = """
`git config` sets configuration that persists, including keys that name a
program git will then run on its own: core.hooksPath, core.pager,
diff.external, credential.helper, and any alias, which executes on a plain git
invocation. Setting one of those turns an ordinary later git command into
arbitrary execution."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  value = "config"

# ============================================================================
# What is allowed
# ============================================================================
#
# ############################################################################
# Nothing runs on a declaration alone. Deny is the engine's default (FR-4.35),
# so a command that is described and unobjected-to is still refused until an
# allow rule names it.
#
# Every block above outranks everything here (FR-4.33), so an allow can never
# widen one and a command appearing in both lists is refused.
#
# What keeps these narrow is not this section. It is tier one in
# 01-structure.toml and the option tables in 05-declarations.toml. `grep x .`
# is permitted; `grep x *.md` is a glob, `grep x f | head` is a pipe, and
# `grep -O prog f` is an undeclared option. None of those is mentioned here.
# ############################################################################

# Reading the filesystem and reporting what is there. None writes.
[group.reads-files]
members = ["ls", "cat", "head", "tail", "wc", "grep", "find", "sort", "cut",
           "readlink"]

# Subcommands of `go` that inspect or produce a named artifact, as opposed to
# compiling and running this tree's own code. The other four are denied by
# `no-go-execution` above and are not repeated here.
[group.go-inspects]
members = ["build", "mod", "list", "vet", "version", "env"]

# qwark's read-only subcommands. `hook` is deliberately absent: it takes its
# subject on stdin, so what it judges is not in the command text, and driving it
# by hand needs a pipe that tier one refuses anyway.
[group.qwark-reads]
members = ["ast", "facts", "rules", "judge", "help"]

[[rule]]
id     = "allow-reading-the-filesystem"
action = "allow"
reason = "Reading a named file or listing a named directory changes nothing."

  [[rule.clause]]
  index = "0"
  group = "reads-files"

[[rule]]
id     = "allow-ordinary-file-work"
action = "allow"
reason = """
Creating a directory, copying a file and moving one are the ordinary operations
of working in a tree, and each names what it acts on."""

  [[rule.clause]]
  index = "0"
  group = "makes-and-moves"

[group.makes-and-moves]
members = ["mkdir", "cp", "mv"]

# `rm` is allowed as a word and refused in a shape, which is the mechanical this
# rule set already uses for `git reflog`. Bare `rm <path>` names what it removes
# and removes only that. `rm-force` in 30-options.toml blocks force, which
# outranks this. Recursion is excluded here instead, so that `rm-recursive`
# can ask: an allow matching it would outrank the ask.
[[rule]]
id     = "allow-removing-a-named-file"
action = "allow"
reason = """
Removing a file the command names is permitted. Recursion is asked about and
force is refused."""

  [[rule.clause]]
  index = "0"
  value = "rm"

  [[rule.clause]]
  option = "recursive"
  absent = true

# A script file in a full language, run by naming it. The path clause is what
# makes it a file: bare `python3` reads its program from stdin and is not
# matched, and every path rule in 20-paths.toml still reads the operands.
[[rule]]
id     = "allow-running-a-script"
action = "allow"
reason = """
Running a script file is permitted: it was written with the file tools, so what
runs is a file somebody can read. A program written into the command line is
not."""

  [[rule.clause]]
  index = "0"
  group = "script-language"

  [[rule.clause]]
  kind = "path"

[[rule]]
id     = "allow-building-go"
action = "allow"
reason = """
`go build`, `go vet`, `go mod` and `go list` compile and inspect. They do not
run this tree's code, which is what `go test`, `go run`, `go generate` and
`go tool` do and why those stay refused."""

  [[rule.clause]]
  index = "0"
  value = "go"

  [[rule.clause]]
  index = "1"
  group = "go-inspects"

[[rule]]
id     = "allow-formatting-go"
action = "allow"
reason = "`gofmt` rewrites formatting and changes no behaviour."

  [[rule.clause]]
  index = "0"
  value = "gofmt"

# So a rule can be tried before it is the reason a command failed. Without
# this, an armed qwark refuses `qwark judge` in the tree that develops it.
#
# Safe because nothing qwark does writes or executes: its whole command line is
# internal/cli/cli.go, importing fmt, io, strings and the parser, with no
# os/exec and no file writing. `judge` and `ast` take a command as an argv
# element and only parse it.
[[rule]]
id     = "allow-trying-a-rule"
action = "allow"
reason = """
qwark parses and reports. What it is given is described, never executed, and
nothing it is given is written."""

  [[rule.clause]]
  index = "0"
  value = "qwark"

  [[rule.clause]]
  index = "1"
  group = "qwark-reads"

# The two halves of the commit workflow hard rules 2 and 3 mandate. `git add`
# reaches this only with `-N`, because `no-git-staging` blocks it otherwise and
# a block outranks an allow.
[[rule]]
id     = "allow-the-mandated-commit-workflow"
action = "allow"
reason = """
Recording that a path exists, and committing the working-tree content of paths
this command names. Both are required for every commit made on this machine."""

  [[rule.clause]]
  index = "0"
  value = "git"

  [[rule.clause]]
  index = "1"
  group = "git-commits"

[group.git-commits]
members = ["add", "stage", "commit"]
