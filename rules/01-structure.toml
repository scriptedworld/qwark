# qwark, structural denials.
#
# ============================================================================
# THE SCHEMA THESE FILES ASSUME
# ============================================================================
#
# A rule is an id, an action, a reason, and clauses. **All clauses must match**
# for the rule to apply; there is no `or` inside a rule, so alternatives are
# written as separate rules.
#
#   action = "deny" | "ask" | "allow" | "tag"
#
# When several rules match, the strictest action wins: deny over ask over
# allow. Order therefore never changes a verdict, and no rule can be weakened
# by which file it arrived in.
#
# A clause SELECTS and then TESTS.
#
#   nodes = ["CmdSubst", …]   the tree holds a node of ANY of these types. The
#                             names are the parser's own, exactly what
#                             `qwark ast` prints.
#
#   flags = ["Background", …] a statement carries ANY of these flags. The four
#                             are Negated, Background, Coprocess and Disown,
#                             named for the fields on the parser's statement.
#
#   ops = ["|", "&&", ">>"]   the tree holds an operator of ANY of these.
#                             `qwark ast` prints them as `op=|`.
#
#   fact = "sequence"         a property none of the three can express.
#
#   index = "0"               ordinal 0 is the command, 1.. its arguments, -1
#                             the last; ranges use `..` and a list may mix
#                             them: "1,3..5,-1"
#   group = "wrapper"         the word is a member of a named set
#   option = "force"          an option with this declared MEANING was given
#   kind = "path"             every word the declaration says denotes a path
#
#   agent = "gate-runner"     the request came from this agent type, so one
#                             rule set carries a different policy per role:
#                             the agent that may WRITE a task definition is not
#                             the agent that may RUN it.
#   agent = ""                THE MAIN SESSION, which reliably carries no agent
#                             type. **Stating no `agent` at all is the
#                             different case: it covers every caller.** The two
#                             do not collapse: a rule meant for the main
#                             session that silently became a rule for everybody
#                             would hand out permission nobody granted.
#
#   cwd = "/srv/project"      the call was made from this directory OR FROM
#                             ANYWHERE INSIDE IT. Containment by path
#                             component with symlinks resolved, not a prefix
#                             of the text: a session works below the root it
#                             started in, and `/srv/proj` is a prefix of
#                             `/srv/project` while neither contains the other.
#                             Payload, like `agent`, so the subject cannot set
#                             it. The value must be absolute; a relative one is
#                             refused at load. A request carrying no cwd does
#                             not satisfy the clause.
#
#   value / partial / pattern   the whole word / anywhere within / a regex over
#                               the whole word (anchored)
#   reading = "interpreted"     what the shell will pass (DEFAULT)
#   reading = "written"         the source, escapes and quotes intact
#
# ---------------------------------------------------------------------------
# WHY `nodes`, `flags` AND `ops` RATHER THAN A FACT FOR EACH
#
# A fact table is a mapping somebody maintains, and a mapping can be incomplete
# without saying so. It was: `TimeClause`, `LetClause`, `ArithmCmd`,
# `CoprocClause` and `DeclClause` established no fact and carry no usable
# command name, which left `time rm x`, `let x=1` and `((x=1))` addressable by
# no rule that could be written. The parser's own vocabularies cannot fall
# behind, so **an unknown node type name must be a configuration error at
# load**, never a clause that quietly matches nothing.
#
# That takes what `fact` has to carry from twenty-two down to two:
#
#   sequence   a COUNT of statements
#   glob       an unquoted literal whose content holds a wildcard; quoting
#              decides it, so `grep "*"` is not one
# ---------------------------------------------------------------------------

# ============================================================================
# The shell itself
# ============================================================================
#
# Not a rule, deliberately. It does not depend on the command, and a rule file
# that simply left the clause out would disable the check in silence. Absence is
# a refusal here: with nothing declared, qwark denies everything. Why the
# grammar has to be established rather than assumed is in
# docs/LESSONS/the-shell-is-zsh-and-the-decision-is-to-change-it.md.
#
# A consistency check on the best available signal, not proof: qwark is a child
# of the process that spawns the shell and cannot observe it directly, so this
# is worth exactly as much as the environment that reports it, which must be
# unwritable like these files.
#
# WHOLE PATHS, NOT NAMES. Comparing basenames would accept any file called bash
# anywhere, including one written into a directory the agent can reach. A
# relative entry here is a configuration error for the same reason.
#
# /bin is a symlink to usr/bin on this machine, so the two entries below are two
# spellings of one root-owned binary, both resolving to /usr/bin/bash.

[shell]
allow = ["/bin/bash", "/usr/bin/bash"]

# ============================================================================
# Tier one: the command must say what it does
# ============================================================================
#
# These are one property, not several bans: the command's effect is fixed by
# its own text. Everything above depends on it. Deciding which paths a command
# reaches is unsound the moment a substitution can produce one at runtime, which
# is how the predecessor of this project was walked past.

[[rule]]
id     = "no-substitution"
action = "deny"
reason = """
Substitutions are not permitted: command, process, arithmetic and parameter
alike, so $HOME and $PWD are included. A command should state what it does. A
substitution makes it a recipe whose result depends on runtime state, and
nothing here is ever expanded to find out."""

  [[rule.clause]]
  nodes = ["CmdSubst", "ProcSubst", "ParamExp", "ArithmExp"]

# A wildcard belongs in tier one for the same reason a substitution does. The
# ruling was deny, with no exception.
#
# A rule about where a command reaches reads the words it was given. `rm *`
# gives it one word that denotes no path at all, so every path rule in
# 20-paths.toml is silent on it. And zsh executes code from inside a glob:
# `rm *(e:'rm -rf /':)` satisfied every other rule in this file and was ALLOWED
# before this one existed. See
# docs/LESSONS/zsh-executes-code-from-inside-a-glob.md.
#
# Quoting decides it, so this does not reach `grep "*" file`.
#
# THE COST: `ls *.go` and `grep x *.md` are refused. The way through is to name
# the files, which is also the only way the verdict can be about the files.

[[rule]]
id     = "no-glob"
action = "deny"
reason = """
A wildcard is not permitted. What it matches is decided by what happens to be
in the directory when it runs, not by the command's own text, which is the
property every other tier-one rule exists to hold. Name the files."""

  [[rule.clause]]
  fact = "glob"

[[rule]]
id     = "no-redirection"
action = "deny"
reason = """
Redirections are not permitted. The tool already returns stdout and stderr
separately, so redirecting to capture output gains nothing, while truncating a
file is a side effect nobody asked for."""

  [[rule.clause]]
  nodes = ["Redirect"]

[[rule]]
id     = "no-pipe"
action = "deny"
reason = "Pipes are not permitted. Run one command."

  [[rule.clause]]
  ops = ["|", "|&"]

[[rule]]
id     = "no-logical-concatenation"
action = "deny"
reason = """
`&&` and `||` are not permitted. Run one command, look at the result, then run
the next."""

  [[rule.clause]]
  ops = ["&&", "||"]

# A here-document is already refused by no-redirection. It is stated again
# because its reason is different. It names operators rather than a node type
# because every redirection is a `Redirect`, so only the operator says which
# kind this is.

[[rule]]
id     = "no-heredoc-write"
action = "deny"
reason = """
Writing a file through a here-document is not permitted. Content arriving as
`cat > f <<'EOF'` was never a diff and was never held against what it replaced.
Use the file tools, where the change can be reviewed."""

  [[rule.clause]]
  ops = ["<<", "<<-", "<<<"]

# ============================================================================
# Composition beyond tier one
# ============================================================================
#
# `;` and `&` were not in the tier-one list but compose commands just as much.

[[rule]]
id     = "no-sequence"
action = "deny"
reason = "Several commands in one call are not permitted. Send them one at a time."

  [[rule.clause]]
  fact = "sequence"

[[rule]]
id     = "no-background"
action = "deny"
reason = """
Backgrounding is not permitted. A backgrounded command outlives the tool call
that started it, so its output is never seen and its failure is never noticed."""

  [[rule.clause]]
  flags = ["Background"]

[[rule]]
id     = "no-grouping"
action = "deny"
reason = "Subshells and brace groups are not permitted."

  [[rule.clause]]
  nodes = ["Subshell", "Block"]

# ============================================================================
# A program rather than an invocation
# ============================================================================
#
# One rule where there were three, because the reason is one reason. Note that
# `ForClause` covers both `for f in …` and `for ((;;))`, so the C-style loop
# needs no name of its own.

[[rule]]
id     = "no-program-structure"
action = "deny"
reason = """
Function definitions, loops and conditionals are not permitted. Run one command
and read its result; a program that decides for itself what to run next cannot
be judged from the text that starts it.

A function is the worst of these: it shadows any command of the same name for
every later call, and neither a backslash nor an absolute path
escapes one: both shells accept a function named `/usr/bin/ls`."""

  [[rule.clause]]
  nodes = ["FuncDecl", "ForClause", "WhileClause", "IfClause", "CaseClause", "TestClause"]

# ============================================================================
# Command forms that carry no command name
# ============================================================================
#
# None of these is a `CallExpr`, so ordinal 0 holds either the WRONG name or
# nothing at all. `time rm x` puts `rm` at ordinal 0; `((x=1))` and `let x=1`
# put nothing there. A clause naming `time` as a command word can never fire,
# which is the whole argument for naming node types.

[[rule]]
id     = "no-time-prefix"
action = "deny"
reason = """
`time` is not permitted. It is a keyword rather than a command, so the word at
ordinal 0 is the command underneath it and `time` itself is unaddressable by
name."""

  [[rule.clause]]
  nodes = ["TimeClause"]

[[rule]]
id     = "no-coprocess"
action = "deny"
reason = """
Coprocesses are not permitted. A coprocess runs alongside the shell with its
own pipes, outliving the call that started it."""

  [[rule.clause]]
  nodes = ["CoprocClause"]

[[rule]]
id     = "no-arithmetic-command"
action = "deny"
reason = "`((…))` and `let` are not permitted; they evaluate rather than run."

  [[rule.clause]]
  nodes = ["ArithmCmd", "LetClause"]

# ============================================================================
# Anything that sets a name
# ============================================================================
#
# `Assign` is the prefix form, `DeclClause` the keyword form: `export`,
# `declare`, `readonly`, `local`, `typeset`. Both decide what a LATER command
# does, and the damage is never in the call that runs them.
#
# Demonstrated: `PATH=<dir>:$PATH rm --anything-at-all` ran a script named `rm`
# from that directory. Every option rule and every command rule is beside the
# point when the program is not the declared one.

[[rule]]
id     = "no-setting-names"
action = "deny"
reason = """
Setting a variable is not permitted, as a prefix or as a keyword. A prefix
assignment changes what the command on the same line resolves to (PATH most
obviously) and an exported one changes it for everything that follows."""

  [[rule.clause]]
  nodes = ["Assign", "DeclClause"]
